# Kiln's own pipeline.
#
# - Every push and pull request: build the image and test it against the example site.
# - Push to main: publish the image as `edge` and `sha-<commit>`, then deploy the showcase site.
# - Tag vX.Y.Z: publish the image as vX.Y.Z, vX.Y, vX and latest (multi-arch), and move the
#   vX and vX.Y git tags so that `uses: Laidwin/kiln/...@v1` follows the release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kiln:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The showcase documents a sample Python package; the Pages workflow does the same with python-package.
      - name: Generate the example's Python API reference
        run: pipx run --spec 'griffe>=1.14,<2' griffe dump pottery --search example/src --docstyle google --full --output example/api.json

      - name: Valid docs.yml passes
        run: docker run --rm -v "$PWD/example":/project kiln:test validate

      - name: Invalid docs.yml fails with a clear error
        run: |
          mkdir -p /tmp/invalid/docs && echo '# Hi' > /tmp/invalid/docs/index.md
          printf 'title: Test\naccent: blue\ncolour: red\n' > /tmp/invalid/docs.yml
          if docker run --rm -v /tmp/invalid:/project kiln:test validate 2> err.txt; then
            echo "::error::An invalid docs.yml was accepted"; exit 1
          fi
          cat err.txt
          grep -q '\[line 2\] accent: must be a hex color' err.txt
          grep -q 'unknown key "colour"' err.txt

      - name: Unreadable theme colors fail
        run: |
          printf 'title: Test\ntheme:\n  dark:\n    background: "#ffffff"\n' > /tmp/invalid/docs.yml
          if docker run --rm -v /tmp/invalid:/project kiln:test validate 2> err.txt; then
            echo "::error::Unreadable theme colors were accepted"; exit 1
          fi
          cat err.txt
          grep -q 'theme.dark: text on background has a contrast of' err.txt

      - name: Build the example under a base path
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e KILN_BASE=/kiln -v "$PWD/example":/project kiln:test build
          test -f example/site/index.html
          test -f example/site/api/index.html
          grep -q 'href="/kiln/api/pottery/clay/#claybody"' example/site/api/pottery/firing/index.html
          # Next to the Python reference, the OpenAPI one lives under /api/rest/.
          grep -q 'https://studio.example.com/v2/firings' example/site/api/rest/firings/start-firing/index.html
          test -f example/site/api/rest/schemas/firing/index.html
          test -d example/site/pagefind
          grep -q 'href="/kiln/getting-started/"' example/site/index.html

      - name: Build a Python API reference
        run: |
          mkdir -p /tmp/py/docs /tmp/py/src/demo
          printf -- '---\ntitle: Demo\n---\n' > /tmp/py/docs/index.md
          printf 'title: Demo\napi:\n  python: api.json\n  exclude: [demo.internal]\n' > /tmp/py/docs.yml
          echo '"""Demo package."""' > /tmp/py/src/demo/__init__.py
          echo '"""Not documented."""' > /tmp/py/src/demo/internal.py
          cat > /tmp/py/src/demo/shapes.py <<'PY'
          """Shapes."""


          class Circle:
              """A circle.

              Args:
                  radius: Radius in centimeters.
              """

              def __init__(self, radius: float = 1.0):
                  self.radius = radius

              def area(self) -> float:
                  """Return the area.

                  Returns:
                      The area in square centimeters.
                  """
                  return 3.14159 * self.radius**2


          def biggest(circles: list[Circle]) -> Circle:
              """Return the biggest circle."""
              return max(circles, key=Circle.area)
          PY
          pipx run --spec 'griffe>=1.14,<2' griffe dump demo --search /tmp/py/src --docstyle google --full --output /tmp/py/api.json
          docker run --rm --user "$(id -u):$(id -g)" -v /tmp/py:/project kiln:test build
          test -f /tmp/py/site/api/index.html
          grep -q 'Radius in centimeters' /tmp/py/site/api/demo/shapes/index.html
          grep -q 'href="/api/demo/shapes/#circle"' /tmp/py/site/api/demo/shapes/index.html
          test ! -e /tmp/py/site/api/demo/internal
          test -d /tmp/py/site/pagefind

      - name: Build an OpenAPI reference and portable Markdown
        run: |
          mkdir -p /tmp/oa/docs/guides
          printf '# Welcome\n\nSee [the guide](guides/start.md#setup).\n\n> [!WARNING]\n> Read this first.\n' > /tmp/oa/docs/index.md
          printf '# Start\n\n## Setup\n\nBack [home](../index.md).\n' > /tmp/oa/docs/guides/start.md
          printf '# Changelog\n\n## 1.0.0\n' > /tmp/oa/CHANGELOG.md
          printf '.site-title { text-transform: uppercase; }\n' > /tmp/oa/extra.css
          cat > /tmp/oa/openapi.yaml <<'YAML'
          openapi: 3.1.0
          info: { title: Pet API, version: 1.0.0, description: Pets for everyone. }
          servers: [{ url: /v1 }]
          security: [{ token: [] }]
          tags: [{ name: pets, x-displayName: Pets }]
          paths:
            /pets/{id}:
              get:
                operationId: getPet
                tags: [pets]
                summary: Get a pet
                parameters: [{ name: id, in: path, required: true, schema: { type: integer, example: 7 } }]
                responses:
                  "200": { description: The pet, content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } } }
          components:
            securitySchemes: { token: { type: http, scheme: bearer } }
            schemas:
              Pet:
                type: object
                required: [name]
                properties:
                  name: { type: string, description: Name of the pet, example: Rex }
          YAML
          cat > /tmp/oa/docs.yml <<'YML'
          title: Pets
          css: extra.css
          nav:
            - { label: Guide, link: /guides/start/ }
          include:
            - { file: CHANGELOG.md, slug: changelog }
          api:
            openapi: openapi.yaml
            server: https://pets.example.com
          YML
          docker run --rm --user "$(id -u):$(id -g)" -v /tmp/oa:/project kiln:test build
          # Portable Markdown: title from the H1, relative links, GitHub alerts, included file.
          grep -q '<title>Start' /tmp/oa/site/guides/start/index.html
          grep -q 'href="/guides/start/#setup"' /tmp/oa/site/index.html
          grep -q 'href="/"' /tmp/oa/site/guides/start/index.html
          grep -q 'starlight-aside--caution' /tmp/oa/site/index.html
          test -f /tmp/oa/site/changelog/index.html
          grep -q 'th-nav' /tmp/oa/site/index.html
          # OpenAPI reference: introduction, operation with samples, schema, published description.
          test -f /tmp/oa/site/api/index.html
          grep -q 'https://pets.example.com/v1/pets/7' /tmp/oa/site/api/pets/get-pet/index.html
          grep -q 'Bearer' /tmp/oa/site/api/pets/get-pet/index.html
          grep -q 'Name of the pet' /tmp/oa/site/api/schemas/pet/index.html
          test -f /tmp/oa/site/kiln-openapi/openapi.yaml
          test -d /tmp/oa/site/pagefind

      - name: Broken OpenAPI references fail with a clear error
        run: |
          printf 'openapi: 3.1.0\ninfo: { title: X, version: "1" }\npaths:\n  /x:\n    get:\n      responses: { "200": { $ref: "#/components/responses/Nope" } }\n' > /tmp/oa/openapi.yaml
          if docker run --rm -v /tmp/oa:/project kiln:test validate 2> err.txt; then
            echo "::error::A broken OpenAPI reference was accepted"; exit 1
          fi
          cat err.txt
          grep -q 'reference "#/components/responses/Nope" points to nothing' err.txt

  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Image references must be lowercase, and the owner name may not be (e.g. "Laidwin").
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/kiln" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  move-tags:
    name: Move vX and vX.Y tags
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Point vX and vX.Y at this release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"
          for tag in "$minor" "$major"; do
            [ "$tag" = v0 ] && continue
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
          done

  showcase:
    name: Showcase site
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Built with the image from this very commit, so the site always shows the current theme.
    uses: ./.github/workflows/pages.yml
    with:
      working-directory: example
      image: ${{ needs.publish.outputs.image }}
      python-package: pottery
      python-path: src
