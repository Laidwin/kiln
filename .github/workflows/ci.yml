# Kiln's own pipeline.
#
# - Every push and pull request: build the image and test it against the example site.
# - Push to main: publish the image as `edge` and `sha-<commit>`, then deploy the showcase site.
# - Tag vX.Y.Z: publish the image as vX.Y.Z, vX.Y, vX and latest (multi-arch), and move the
#   vX and vX.Y git tags so that `uses: Laidwin/kiln/...@v1` follows the release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kiln

jobs:
  test:
    name: Test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kiln:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Valid docs.yml passes
        run: docker run --rm -v "$PWD/example":/project kiln:test validate

      - name: Invalid docs.yml fails with a clear error
        run: |
          mkdir -p /tmp/invalid/docs && echo '# Hi' > /tmp/invalid/docs/index.md
          printf 'title: Test\naccent: blue\ncolour: red\n' > /tmp/invalid/docs.yml
          if docker run --rm -v /tmp/invalid:/project kiln:test validate 2> err.txt; then
            echo "::error::An invalid docs.yml was accepted"; exit 1
          fi
          cat err.txt
          grep -q '\[line 2\] accent: must be a hex color' err.txt
          grep -q 'unknown key "colour"' err.txt

      - name: Build the example under a base path
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e KILN_BASE=/kiln -v "$PWD/example":/project kiln:test build
          test -f example/site/index.html
          test -f example/site/api/index.html
          test -d example/site/pagefind
          grep -q 'href="/kiln/getting-started/"' example/site/index.html

  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  move-tags:
    name: Move vX and vX.Y tags
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Point vX and vX.Y at this release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"
          for tag in "$minor" "$major"; do
            [ "$tag" = v0 ] && continue
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
          done

  showcase:
    name: Showcase site
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Built with the image from this very commit, so the site always shows the current theme.
    uses: ./.github/workflows/pages.yml
    with:
      working-directory: example
      image: ${{ needs.publish.outputs.image }}
