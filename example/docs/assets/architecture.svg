<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Inter, system-ui, 'Segoe UI', sans-serif" role="img" aria-labelledby="t">
  <title id="t">Kiln pipeline: docs.yml and the docs folder go into the Kiln container, which writes a static site published to GitHub Pages</title>
  <rect width="760" height="240" rx="18" fill="#f4f6f9"/>
  <g font-size="15" text-anchor="middle">
    <rect x="30" y="75" width="160" height="90" rx="14" fill="#fff" stroke="#d5dae2"/>
    <text x="110" y="113" fill="#141a24" font-weight="600">Your project</text>
    <text x="110" y="136" fill="#515b6a" font-size="13" font-family="ui-monospace, Menlo, monospace">docs.yml · docs/</text>
    <rect x="235" y="60" width="170" height="120" rx="14" fill="#b8480f"/>
    <text x="320" y="106" fill="#fff" font-weight="650" font-size="18">Kiln</text>
    <text x="320" y="130" fill="#fff3eb" font-size="13">Astro · Starlight · theme</text>
    <text x="320" y="150" fill="#fff3eb" font-size="13">in one container</text>
    <rect x="450" y="75" width="120" height="90" rx="14" fill="#fff" stroke="#d5dae2"/>
    <text x="510" y="113" fill="#141a24" font-weight="600">Static site</text>
    <text x="510" y="136" fill="#515b6a" font-size="13" font-family="ui-monospace, Menlo, monospace">site/</text>
    <rect x="615" y="75" width="120" height="90" rx="14" fill="#fff" stroke="#d5dae2"/>
    <text x="675" y="113" fill="#141a24" font-weight="600">Any host</text>
    <text x="675" y="136" fill="#515b6a" font-size="13">GitHub Pages…</text>
  </g>
  <g stroke="#8a93a2" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 120h40M224 114l6 6-6 6"/><path d="M405 120h40M439 114l6 6-6 6"/><path d="M570 120h40M604 114l6 6-6 6"/>
  </g>
</svg>
